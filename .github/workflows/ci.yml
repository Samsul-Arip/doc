name: Pemeriksaan masterclass
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-local-only
          MYSQL_DATABASE: masterclass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-local-only --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-local-only
      DB_NAME: masterclass
      MYSQL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run format:check --prefix backend
      - run: npm run lint --prefix backend
      - run: npm run build --prefix backend
      - name: Buat tabel dan seed pada MySQL nyata
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          MYSQL_PWD="$DB_PASSWORD" mysql -h 127.0.0.1 -u root masterclass < mysql-masterclass/schema/01-tables.sql
          MYSQL_PWD="$DB_PASSWORD" mysql -h 127.0.0.1 -u root masterclass < mysql-masterclass/seed/02-seed.sql
      - run: node mysql-masterclass/tests/verify.mjs
      - run: npm test --prefix backend
      - run: npm audit --prefix backend --audit-level=high
  simulator-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: backend/node_modules/.bin/eslint --config simulator/eslint.config.cjs simulator
      - run: backend/node_modules/.bin/prettier --check .
      - run: node --test simulator/tests/*.test.cjs
      - run: python3 scripts/check_links.py
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pasang compiler Kotlin dan ktlint
        run: |
          curl -fL https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip -o /tmp/kotlin.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo /tmp/kotlin/kotlinc/bin >> "$GITHUB_PATH"
          curl -fL https://repo.maven.apache.org/maven2/com/pinterest/ktlint/ktlint-cli/1.5.0/ktlint-cli-1.5.0-all.jar -o /tmp/ktlint.jar
      - name: Lint Kotlin (source diamond utama dipertahankan sesuai materi)
        run: java -jar /tmp/ktlint.jar 'kotlin-logic/**/*.kt' '!kotlin-logic/patterns/DiamondMain.kt'
      - run: bash scripts/kotlin.sh test
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true
      - name: Pub get, format, analyze, test, dan build Android
        working-directory: flutter-crud
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-debug-apk
          path: flutter-crud/build/app/outputs/flutter-apk/app-debug.apk

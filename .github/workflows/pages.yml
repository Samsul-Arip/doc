name: Publikasi Logic Lab ke GitHub Pages
on:
  push:
    branches: [main]
    paths: ['simulator/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test simulator/tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - name: Kemas hanya aset publik
        run: |
          mkdir -p .pages
          cp simulator/index.html simulator/style.css simulator/engine.js simulator/app.js .pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
